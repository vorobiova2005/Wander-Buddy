services:
  wander-buddy-server:
    build:
      context: .
      target: server
    image: ghcr.io/vorobiova2005/wander-buddy-server:latest
    container_name: wander-buddy-server
    restart: unless-stopped
    # A tiny init as PID 1 passes SIGTERM on to Node and reaps zombies.
    init: true
    environment:
      # Values come from the deploy step (GitHub Actions secrets), never from this file.
      - GROQ_API_KEY
      - OPENTRIPMAP_API_KEY
      - TZ=Europe/Berlin
    volumes:
      # Known station → town answers; a named volume keeps the image's owner (node).
      - wander-buddy-state:/app/state
    # Not published on the host: only the web container reaches it (/api proxy).
    expose:
      - "8080"

  wander-buddy-web:
    build:
      context: .
      target: web
    image: ghcr.io/vorobiova2005/wander-buddy-web:latest
    container_name: wander-buddy-web
    restart: unless-stopped
    depends_on:
      wander-buddy-server:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:80"

volumes:
  wander-buddy-state:
