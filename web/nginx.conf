# The public entry point: serves the built site and proxies the API to the server container,
# so the browser sees one origin (no CORS needed for the site itself).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS: re-resolve the server container's address, so a restarted server
    # (new IP) does not leave nginx answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/* → the server container (service name in docker-compose.yml).
    location /api/ {
        set $api_upstream http://wander-buddy-server:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change: cache for a year. A missing one is a real 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /VERSION {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any other path gets index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
