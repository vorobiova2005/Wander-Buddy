name: CI

# CI runs the same commands as the local gate (scripts/gate.py → `npm run check -w web|server`).
# CD calls this workflow before building the image (workflow_call), so a tag on a red commit
# never reaches the server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web - lint, typecheck, test
        run: npm run check -w web

      - name: Web - end-to-end (Playwright, the runner's Chrome)
        run: npm run e2e -w web

      - name: Server - typecheck, test
        run: npm run check -w server

      - name: Build
        run: npm run build

  # Both production images must build: a broken Dockerfile is caught here, not on release day.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build server and web images
        run: |
          docker build --target server -t wander-buddy-server:ci .
          docker build --target web -t wander-buddy-web:ci .
